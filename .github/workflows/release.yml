name: release

# Tag a commit (git tag v0.2.0 && git push origin v0.2.0) and this publishes
# the binary archives and the container image.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  MODULE: github.com/kusalkalinga00/reflow-pdf-to-epub

jobs:
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only hosted runners a private repository can use: Linux amd64,
          # macOS amd64 and macOS arm64. Linux arm64 is covered by the image.
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          - { os: macos-14, goos: darwin, goarch: arm64 }

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PDFium
        run: |
          ./scripts/pdfium.sh
          echo "PKG_CONFIG_PATH=$PWD/.pdfium/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          CGO_ENABLED: '1'
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "${{ matrix.goos }}" in
            linux)  rpath='$ORIGIN/lib' ;;
            darwin) rpath='@loader_path/lib' ;;
          esac

          mkdir -p stage/lib
          go build -trimpath \
            -ldflags "-s -w -X ${MODULE}/internal/version.Version=${VERSION} -extldflags '-Wl,-rpath,${rpath}'" \
            -o stage/reflow ./cmd/reflow

          cp .pdfium/lib/libpdfium* stage/lib/
          cp README.md stage/
          if [ -f LICENSE ]; then cp LICENSE stage/; fi

          name="reflow_${VERSION#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          tar czf "${name}.tar.gz" -C stage .
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Prove the archive runs without the build directory
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar xzf "$ARCHIVE" -C unpacked

          # Hide the build-time library and clear the loader paths: the
          # bundled lib/ beside the binary is the only thing left to find.
          mv .pdfium/lib .pdfium/lib.off
          trap 'mv .pdfium/lib.off .pdfium/lib' EXIT
          out="$(env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH ./unpacked/reflow version)"
          echo "$out"

          case "$out" in
            *"${VERSION#v}"*) ;;
            *) echo "version output does not name $VERSION: $out" >&2; exit 1 ;;
          esac

      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.sha256

  publish:
    name: publish release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  image:
    name: container image
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
