name: release

# Tag a commit (git tag v0.2.0 && git push origin v0.2.0) and this publishes
# the binary archives and the container image.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  MODULE: github.com/kusalkalinga00/reflow-pdf-to-epub

jobs:
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only hosted runners a private repository can use: Linux amd64,
          # macOS amd64 and macOS arm64. Linux arm64 is covered by the image.
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          - { os: macos-14, goos: darwin, goarch: arm64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PDFium
        run: |
          ./scripts/pdfium.sh
          echo "PKG_CONFIG_PATH=$PWD/.pdfium/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          CGO_ENABLED: '1'
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "${{ matrix.goos }}" in
            linux)  rpath='$ORIGIN/lib' ;;
            darwin) rpath='@loader_path/lib' ;;
          esac

          mkdir -p stage/lib
          go build -trimpath \
            -ldflags "-s -w -X ${MODULE}/internal/version.Version=${VERSION} -extldflags '-Wl,-rpath,${rpath}'" \
            -o stage/reflow ./cmd/reflow

          cp .pdfium/lib/libpdfium* stage/lib/
          cp README.md stage/
          if [ -f LICENSE ]; then cp LICENSE stage/; fi

          name="reflow_${VERSION#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          tar czf "${name}.tar.gz" -C stage .
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Prove the archive runs without the build directory
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar xzf "$ARCHIVE" -C unpacked

          # Hide the build-time library and clear the loader paths: the
          # bundled lib/ beside the binary is the only thing left to find.
          mv .pdfium/lib .pdfium/lib.off
          trap 'mv .pdfium/lib.off .pdfium/lib' EXIT
          out="$(env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH ./unpacked/reflow version)"
          echo "$out"

          case "$out" in
            *"${VERSION#v}"*) ;;
            *) echo "version output does not name $VERSION: $out" >&2; exit 1 ;;
          esac

      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.sha256

  publish:
    name: publish release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  image:
    name: container image
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
