name: edge

# Every push to main publishes the container image, so a user can run Reflow
# without a clone or a toolchain. A release tag publishes versioned images from
# release.yml; this is the moving "latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=main-${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: smoke test the published image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Reflow
        run: |
          set -euo pipefail
          docker run -d --name reflow -p 127.0.0.1:8080:8080 \
            "ghcr.io/${{ github.repository }}:latest"

      - name: Wait for health, then convert a PDF
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz

          # The landing page must be the app, not an error page.
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>Reflow — PDF to EPUB 3</title>"

      - name: Logs
        if: failure()
        run: docker logs reflow

      - name: Stop
        if: always()
        run: docker rm -f reflow || true
