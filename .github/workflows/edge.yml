name: edge

# Publishes the moving `latest` and `edge` images, so a user can run Reflow
# without a clone or a toolchain.
#
# It is manual on purpose. On the Free plan a private container image counts
# against 500 MB of Packages storage, shared with Actions caches; two
# architectures are about 350 MB. Once the repository and the package are
# public, image storage and transfer are free — at that point this can be
# triggered from `push: branches: [main]` again.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=main-${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: smoke test the published image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Reflow
        run: |
          set -euo pipefail
          docker run -d --name reflow -p 127.0.0.1:8080:8080 \
            "ghcr.io/${{ github.repository }}:latest"

      - name: Wait for health, then convert a PDF
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz

          # The landing page must be the app, not an error page.
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>Reflow — PDF to EPUB 3</title>"

      - name: Logs
        if: failure()
        run: docker logs reflow

      - name: Stop
        if: always()
        run: docker rm -f reflow || true
