name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PDFium
        run: |
          ./scripts/pdfium.sh
          echo "PKG_CONFIG_PATH=$PWD/.pdfium/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/.pdfium/lib" >> "$GITHUB_ENV"

      - name: Install EPUBCheck
        run: |
          ./scripts/epubcheck.sh
          echo "EPUBCHECK_JAR=$PWD/.epubcheck/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # High-severity gosec only: the lower tiers are dominated by unchecked
      # error writes to HTTP responses, which is noise here. The rules that can
      # bite (command injection, path traversal, integer overflow) are high.
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -severity high -confidence high ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath ./...

  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck loads the real build graph, and that graph contains cgo.
      # Without PDFium it fails to load go-pdfium instead of analysing it.
      - name: Install PDFium
        run: |
          ./scripts/pdfium.sh
          echo "PKG_CONFIG_PATH=$PWD/.pdfium/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/.pdfium/lib" >> "$GITHUB_ENV"

      # govulncheck is the Go team's database of reachable vulnerabilities:
      # it reports a CVE only when the vulnerable code is actually called.
      # v1.10.0 is the first line that understands Go 1.27's syntax tree;
      # v1.1.4 panics on composite literals it has no case for.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  docker:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: reflow:ci
          build-args: VERSION=ci
          cache-from: type=gha
          # mode=min keeps only the layers the final image needs. mode=max
          # also stores intermediate stages, which is faster but counts
          # against the same storage quota as the image itself.
          cache-to: type=gha,mode=min

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run --rm reflow:ci version
          docker run -d --rm --name reflow-ci -p 127.0.0.1:8080:8080 reflow:ci
          trap 'docker stop reflow-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy" >&2
          docker logs reflow-ci >&2
          exit 1
