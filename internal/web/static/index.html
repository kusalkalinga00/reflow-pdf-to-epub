<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reflow — PDF to EPUB 3</title>
  <meta name="description" content="Turn a PDF into a reflowable EPUB 3 book, with a measured quality report.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H11v18H6.5A1.5 1.5 0 0 1 5 19.5z"/>
        <path d="M11 3h6.5A1.5 1.5 0 0 1 19 4.5v15a1.5 1.5 0 0 1-1.5 1.5H11"/>
      </svg>
      <span>Reflow</span>
    </header>

    <h1>PDF to EPUB</h1>
    <p class="lede">A reflowable EPUB 3 book with a measured quality report.</p>

    <form id="convert-form" novalidate>
      <div class="drop" id="drop">
        <input type="file" id="file" name="file" accept="application/pdf,.pdf">
        <label for="file" class="drop-label">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V4"/>
            <path d="M7.5 8.5 12 4l4.5 4.5"/>
            <path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/>
          </svg>
          <span class="drop-title">Drop a PDF, or <span class="link">browse</span></span>
          <span class="drop-note">Up to 100 MB · 1,000 pages</span>
        </label>
        <p class="file-name" id="file-name" hidden></p>
      </div>

      <div class="password" id="password-row" hidden>
        <label for="password">PDF password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" spellcheck="false">
        <p class="hint">Reflow opens a PDF you can already read; it never removes DRM.</p>
      </div>

      <div class="actions">
        <button type="submit" id="submit" disabled>Convert</button>
        <button type="button" id="cancel" class="ghost" hidden>Cancel</button>
      </div>
    </form>

    <div class="progress" id="progress-wrap" hidden>
      <p id="progress-label"></p>
      <progress id="progress" max="100"></progress>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="result" id="result" hidden aria-labelledby="result-title">
      <div class="result-head">
        <span class="result-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </span>
        <div>
          <h2 id="result-title">Ready</h2>
          <p class="stats" id="stats"></p>
        </div>
      </div>
      <ul class="issues" id="issues" aria-label="Conversion notes"></ul>
      <a class="download" id="download" download>Download EPUB</a>
    </section>

    <p class="foot">Converted in memory, never stored. No accounts, no history.</p>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
