<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reflow — PDF to EPUB</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <header>
      <h1>Reflow</h1>
      <p class="tagline">Turn a PDF into a reflowable EPUB.</p>
    </header>

    <form id="convert-form" novalidate>
      <div class="drop" id="drop">
        <input type="file" id="file" name="file" accept="application/pdf,.pdf">
        <label for="file" class="drop-label">
          <span class="drop-title">Choose a PDF</span>
          <span class="drop-hint">or drop one here</span>
        </label>
        <p class="file-name" id="file-name" hidden></p>
      </div>

      <button type="submit" id="submit" disabled>Convert to EPUB</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="result" id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title">Your book is ready</h2>
      <p class="stats" id="stats"></p>
      <a class="download" id="download" download>Download EPUB</a>
    </section>

    <footer>
      <p>
        Files are converted in memory and never stored. Scanned PDFs without a
        text layer are refused, because OCR is not available yet.
      </p>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
